<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Friend Response ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="question-page responses-page">

        <p class="small-title">🌸 A LITTLE LOOK INTO YOUR ANSWERS 🌸</p>

        <h1 id="personName">Friend ❤️</h1>

        <!-- PAGE 4 -->
        <section class="response-section">

            <h2>🌸 If I Was...</h2>

            <div id="ifWasAnswers"></div>

        </section>


        <!-- PAGE 5 -->
        <section class="response-section">

            <h2>🧠 How Do You See Me?</h2>

            <div id="howSeeAnswers"></div>

        </section>


        <!-- PAGE 6 -->
        <section class="response-section">

            <h2>💌 Tell Me Honestly</h2>

            <div id="honestAnswers"></div>

        </section>


        <button class="next-btn" onclick="goBack()">
            ← BACK TO FRIENDS
        </button>

    </main>


    <script type="module">

import { db } from "./firebase.js";

import {
    collection,
    getDocs,
    query,
    where
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const person = localStorage.getItem("viewingPerson");


const personName =
    document.getElementById("personName");

const ifWasContainer =
    document.getElementById("ifWasAnswers");

const howSeeContainer =
    document.getElementById("howSeeAnswers");

const honestContainer =
    document.getElementById("honestAnswers");


if (!person) {

    personName.textContent = "No Friend Selected";

} else {

    const displayName =
        person
            .split(" ")
            .map(word =>
                word.charAt(0).toUpperCase() + word.slice(1)
            )
            .join(" ");

    personName.textContent =
        displayName + " ❤️";


    try {

        const q = query(
            collection(db, "responses"),
            where("person", "==", person)
        );


        const snapshot =
            await getDocs(q);


        ifWasContainer.innerHTML = "";
        howSeeContainer.innerHTML = "";
        honestContainer.innerHTML = "";


        let foundIfWas = false;
        let foundPage5 = false;
        let foundHonest = false;


        snapshot.forEach(function(doc) {

            const data = doc.data();


            if (data.section === "ifWas") {

                foundIfWas = true;

                displayAnswers(
                    data.answers,
                    ifWasContainer
                );

            }


            else if (data.section === "page5") {

                foundPage5 = true;

                displayAnswers(
                    data.answers,
                    howSeeContainer
                );

            }


            else if (data.section === "honest") {

                foundHonest = true;

                displayAnswers(
                    data.answers,
                    honestContainer
                );

            }

        });


        if (!foundIfWas) {

            ifWasContainer.innerHTML =
                "<p>No Page 4 answers yet. 💭</p>";

        }


        if (!foundPage5) {

            howSeeContainer.innerHTML =
                "<p>No Page 5 answers yet. 💭</p>";

        }


        if (!foundHonest) {

            honestContainer.innerHTML =
                "<p>No Page 6 answers yet. 💭</p>";

        }


    } catch (error) {

        console.error(error);

        ifWasContainer.innerHTML =
            "<p>Unable to load answers.</p>";

        howSeeContainer.innerHTML =
            "<p>Unable to load answers.</p>";

        honestContainer.innerHTML =
            "<p>Unable to load answers.</p>";

    }

}


function displayAnswers(answers, container) {

    for (const key in answers) {

        const box =
            document.createElement("div");

        box.className = "answer-box";


        box.innerHTML =
            "<strong>" +
            key +
            "</strong><br>" +
            (answers[key] || "No answer");


        container.appendChild(box);

    }

}


function goBack() {

    window.location.href =
        "responses.html";

}

</script>

</body>
</html>
