        q16: formData.get("q16"),
        q17: formData.get("q17"),
        q18: formData.get("q18")

    };


    const selectedPerson =
        localStorage.getItem("selectedPerson");


    localStorage.setItem(
        "howSeeAnswers_" + selectedPerson,

});
